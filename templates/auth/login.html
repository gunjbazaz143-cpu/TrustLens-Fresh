{% extends "base.html" %}

{% block title %}Login - TrustLens{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card glass reveal">
    <div class="text-center mb-4">
      <div class="brand-mark mx-auto mb-3" style="width:52px;height:52px;font-size:1.4rem;">&#128274;</div>
      <h2 class="mb-1">Welcome back</h2>
      <p class="text-muted-c small mb-0">Sign in to access your dashboard and scan history.</p>
    </div>
    <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
      <div class="mb-3">
        <label class="form-label-c" for="email">Email address</label>
        <input type="email" class="form-control form-control-trust" id="email" name="email" placeholder="you@example.com" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label-c" for="password">Password</label>
        <input type="password" class="form-control form-control-trust" id="password" name="password" placeholder="Your password" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="remember" id="remember" style="background-color:transparent;border-color:var(--border);">
          <label class="form-check-label small text-muted-c" for="remember">Remember me</label>
        </div>
        <a href="#" class="small text-dim-c">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-trust w-100">Sign In</button>
    </form>
    <p class="text-center text-muted-c small mt-4 mb-0">
      New to TrustLens? <a href="{{ url_for('auth.register') }}" class="fw-bold">Create an account</a>
    </p>
  </div>
</section>
{% endblock %}
